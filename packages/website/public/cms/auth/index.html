<!doctype html>
<!-- lang="fr": the editor is French and the CMS itself is configured in French
     (config.yml labels, the site's default locale). Only this sign-in step was
     ever in English. -->
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Connexion CMS</title>
  <style>
    /* Values copied from src/styles/theme.css rather than imported: Astro
       emits that stylesheet to /_astro/*.css, and cloudfront-cms-function.js
       404s anything outside /cms/ and /api/, so this standalone page cannot
       link it. Keep the copies in sync with theme.css by hand — an earlier
       drift here left the kicker at #c8553d, which fails WCAG AA on white
       (4.35:1); the real brand vermillion #b22222 clears it at 6.68:1. */
    :root {
      --bg: #f3ede1;
      --fg: #1a1612;
      --text-muted: #4a4138;
      --kicker: #b22222;
      --on-kicker: #fff;
      --field-bg: #fff;
      --field-border: #c8bfad;
      --error: #b04a3a;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      /* viewport-fit=cover lets the page paint under a notch, so each edge
         takes the larger of the base inset and the device's safe area. This
         popup opens full-screen on iOS Safari, where the top inset is ~47px
         against a 24px base padding. */
      padding:
        max(1.5rem, env(safe-area-inset-top))
        max(1.5rem, env(safe-area-inset-right))
        max(1.5rem, env(safe-area-inset-bottom))
        max(1.5rem, env(safe-area-inset-left));
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      box-sizing: border-box;
    }
    .card {
      max-width: 22rem;
      margin: 2rem auto 0;
      background: var(--field-bg);
      border-radius: 8px;
      padding: 2rem 1.5rem;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }
    h1 {
      /* 1.75rem over the 0.8rem floor gives a ~2.2:1 overall type range, which
         is the spread the design detector measures (per-step ratios alone don't
         satisfy it). Kept uppercase + letter-spaced to stay in the site's
         editorial kicker idiom rather than reading as a generic heading. */
      font-size: 1.75rem;
      margin: 0 0 1.5rem;
      color: var(--kicker);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    label {
      display: block;
      /* One small tier at 0.8rem, a 1.25 step below the 1rem form controls;
         .error and .hint share it deliberately. Three sizes total (1.4 / 1 /
         0.8) rather than four bunched ones. Don't shrink the controls below
         1rem — iOS zooms the viewport on focus for anything smaller. */
      font-size: 0.8rem;
      margin: 1rem 0 0.25rem;
    }
    input {
      width: 100%;
      /* 0.8rem block padding puts the control at ~47px tall, clearing the 44px
         minimum touch target (WCAG 2.5.8) for thumb use on a phone. */
      padding: 0.8rem 0.75rem;
      border: 1px solid var(--field-border);
      border-radius: 4px;
      font-size: 1rem;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      margin-top: 1.5rem;
      padding: 0.85rem; /* ~48px tall — see the touch-target note on input. */
      border: none;
      border-radius: 4px;
      background: var(--kicker);
      color: var(--on-kicker);
      font-size: 1rem;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    /* Keyboard users need a ring the custom field borders don't swallow. --fg
       reads against both the white card and the vermillion button, so one rule
       covers every control (WCAG 2.4.7). :focus-visible keeps it off mouse
       clicks. */
    input:focus-visible,
    button:focus-visible {
      outline: 2px solid var(--fg);
      outline-offset: 2px;
    }
    .error {
      color: var(--error);
      font-size: 0.8rem;
      margin-top: 1rem;
      min-height: 1.2em;
    }
    .hint {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 1rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Connexion CMS</h1>
    <form id="login-form">
      <label for="email">Adresse e-mail</label>
      <input id="email" name="email" type="email" autocomplete="username" required autofocus />
      <label for="password">Mot de passe</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />
      <button id="submit" type="submit">Se connecter</button>
      <p id="error" class="error" role="alert"></p>
    </form>
    <p class="hint">Cette fenêtre se ferme automatiquement après la connexion.</p>
  </div>

  <!-- Sign-in logic lives in src/cms-auth/main.js and is bundled to ./auth.js
       by scripts/build-cms-auth.mjs (wired into `yarn dev` and `yarn build`).
       Same-origin on purpose: this page reads the editor's password, so no
       third-party CDN belongs in it. Amplify v6 also ships no browser-global
       build, so the v5 script-tag pattern has no direct successor. -->
  <script type="module" src="./auth.js"></script>
</body>
</html>
